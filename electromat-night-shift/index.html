<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zaps Electromat — Night Shift</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" crossorigin href="./assets/index-CADKHryD.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="hud" class="hidden">
        <img id="mark" src="./brand/wordmark-cream.svg" alt="Zaps Electromat" />
        <div id="who">ZOEY · STATION MASTER</div>
        <div id="cross"></div>
        <div id="clock">22:00</div>
        <div id="cash">$0</div>
        <div id="pips"><i></i><i></i><i></i></div>
        <div id="auto">AUTO 0</div>
        <div id="prompt"></div>
        <div id="toast"></div>
      </div>
      <div id="title">
        <img src="./brand/wordmark-cream.svg" alt="Zaps Electromat" />
        <div id="title-site">STATION 001</div>
        <div id="title-rule"></div>
        <div id="title-line">DRIVE IN. CHARGE UP. ZIP OUT.</div>
        <div id="title-go">CLICK TO WALK</div>
      </div>
      <div id="end" class="hidden">
        <img src="./brand/wordmark-cream.svg" alt="Zaps Electromat" />
        <div id="grade"></div>
      </div>
    </div>
    <script type="module">
      const parts = await Promise.all(
        Array.from({ length: 27 }, (_, i) =>
          fetch("./assets/p" + i + ".js.txt").then((r) => {
            if (!r.ok) throw new Error("missing chunk " + i);
            return r.text();
          })
        )
      );
      const blob = new Blob(parts, { type: "text/javascript" });
      await import(URL.createObjectURL(blob));
    </script>
  </body>
</html>
